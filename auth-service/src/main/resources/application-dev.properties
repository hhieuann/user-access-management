# =========================================================
# DEV PROFILE - CHI DUNG CHO LOCAL DEVELOPMENT
# =========================================================
# Khong duoc set profile nay khi deploy production.
# Production phai dung profile 'docker' hoac 'prod' (khong co fallback secret).
# =========================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/auth-service
spring.datasource.username=postgres
# Fallback "123456" chi dung cho local dev. Set DB_PASSWORD env de override.
spring.datasource.password=${DB_PASSWORD:123456}
# Dev: dung Flyway de quan ly schema, khong cho Hibernate auto-update.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
# Fallback secret CHI dung local. Production set JWT_SECRET env (>= 32 ky tu).
jwt.secret=${JWT_SECRET:devSecretKeyForLocalDevelopmentOnly123456}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false