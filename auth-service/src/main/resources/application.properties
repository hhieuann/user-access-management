server.port=8081
spring.application.name=auth-service
# Khong set spring.profiles.active mac dinh.
# Phai truyen profile qua SPRING_PROFILES_ACTIVE env hoac -Dspring.profiles.active=...
# Cac profile co san: dev | docker | test | ci | prod

# JPA
# Khong set hibernate.dialect explicit - Hibernate 6 tu detect tu JDBC connection
# (tranh warning HHH90000025).
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.enabled=true
# Production goi y: chay actuator tren management.server.port rieng (vd 9081),
# va chi expose port nay trong internal network.