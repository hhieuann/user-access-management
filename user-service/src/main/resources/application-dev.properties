# =========================================================
# DEV PROFILE - CHI DUNG CHO LOCAL DEVELOPMENT
# =========================================================
# Khong duoc set profile nay khi deploy production.
# Production phai dung profile 'docker' hoac 'prod' (khong co fallback secret).
# =========================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/user-service
spring.datasource.username=postgres
# Fallback "123456" chi dung cho local dev. Set DB_PASSWORD env de override.
spring.datasource.password=${DB_PASSWORD:123456}
# Dev: dung Flyway de quan ly schema, khong cho Hibernate auto-update.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
# Fallback secret CHI dung local. Production set JWT_SECRET env (>= 32 ky tu).
jwt.secret=${JWT_SECRET:devSecretKeyForLocalDevelopmentOnly123456}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Kafka Consumer
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=user-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.r2s.core.event.UserRegisteredEvent
spring.kafka.consumer.auto-offset-reset=earliest