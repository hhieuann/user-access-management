# =========================================================
# PRODUCTION PROFILE - FAIL-FAST KHI THIEU ENV
# =========================================================
# Khong co fallback cho secret/password.
# Phai set day du:
#   SPRING_DATASOURCE_URL
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
#   JWT_SECRET            (toi thieu 32 ky tu, random)
#   SPRING_KAFKA_BOOTSTRAP_SERVERS
# =========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Production: KHONG cho Hibernate sua schema. Flyway lam chu migration.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JWT secret BAT BUOC co env, khong fallback.
jwt.secret=${JWT_SECRET}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Kafka Consumer
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=user-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.r2s.core.event.UserRegisteredEvent
spring.kafka.consumer.auto-offset-reset=earliest
